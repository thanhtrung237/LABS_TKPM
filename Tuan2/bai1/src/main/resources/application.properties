# Application Configuration
spring.application.name=notification-system
app.name=Notification Management System
app.version=1.0.0
app.environment=DEVELOPMENT

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.iuh.fit.bai1=DEBUG
logging.level.org.springframework=INFO

# Notification System Configuration
notification.default.priority=MEDIUM
notification.retry.attempts=3
notification.timeout.seconds=30
