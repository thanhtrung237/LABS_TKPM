version: "3.8"

services:
  # ── Backend (Node + Express + Plugins) ──────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/posts"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Frontend (React + Vite) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── Database (tuỳ chọn, dùng khi cần lưu thật) ──────────
